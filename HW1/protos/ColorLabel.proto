#VRML_SIM R2025a utf8
# Sign post with a colored panel (0.30 x 0.20 m). Used to label output conveyors
# (sorting scenario) or input conveyors (shipment scenario).
# Visual only: no bounding object, so robots cannot collide with it.

PROTO ColorLabel [
  field SFVec3f    translation 0 0 0
  field SFRotation rotation    0 0 1 0
  field SFString   name        "label"
  field SFColor    color       0.85 0.10 0.10
]
{
  Solid {
    translation IS translation
    rotation IS rotation
    name IS name
    children [
      Transform {
        translation 0 0 0.325
        children [
          Shape {
            appearance PBRAppearance {
              baseColor 0.2 0.2 0.22
              roughness 1
              metalness 0
            }
            geometry Box {
              size 0.03 0.03 0.65
            }
          }
        ]
      }
      Transform {
        translation 0 0 0.75
        children [
          Shape {
            appearance PBRAppearance {
              baseColor IS color
              emissiveColor IS color
              emissiveIntensity 0.4
              roughness 0.8
              metalness 0
            }
            geometry Box {
              size 0.30 0.02 0.20
            }
          }
        ]
      }
    ]
  }
}
